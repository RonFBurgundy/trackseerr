[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
markers =
    local_media: tests against a real local music library (opt-in via TRACKSEERR_LOCAL_MEDIA / RUN_LOCAL_MEDIA; see docs/LOCAL_MEDIA_TESTS.md)
    network: tests that need outbound network access (MusicBrainz, AcoustID)
