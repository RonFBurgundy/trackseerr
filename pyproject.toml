[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackseerr"
version = "1.0.0"
description = "The music request, discovery, and playlist sync suite for Plex, Plexamp & Lidarr."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "RonFBurgundy" }
]
keywords = ["plex", "plexamp", "spotify", "deezer", "playlist", "sync", "multitenant", "homelab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "spotipy>=2.25.0",
    "plexapi>=4.18.0",
    "deezer-python>=7.4.0",
    "requests>=2.32.0",
    "urllib3>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[project.scripts]
trackseerr = "trackseerr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trackseerr*"]

[tool.setuptools.package-data]
trackseerr = ["static/*", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["integration: contract tests against a real Lidarr container (RUN_INTEGRATION=1, see docs/INTEGRATION_TESTS.md)"]

[tool.ruff.lint]
ignore = ["B008"]
