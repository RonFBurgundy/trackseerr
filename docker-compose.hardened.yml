# =============================================================================
# TrackSeerr Hardened Homelab Deployment Topology
# Two-Tier DMZ Architecture: Stateless Gateway (DMZ) + Core Acquisition Engine
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tier 1: Public Gateway (DMZ Ingress)
  # Completely stateless, zero disk mounts, isolated on reverse-proxy network.
  # Handles authentication, web UI, discovery, and requests safely.
  # ---------------------------------------------------------------------------
  trackseerr-gateway:
    image: ghcr.io/ronfburgundy/trackseerr:latest
    container_name: trackseerr-gateway
    restart: unless-stopped
    ports:
      - "5250:5250"
    environment:
      - ROLE=gateway
      - INTERNAL_CORE_SECRET=${INTERNAL_CORE_SECRET:?set a 32+ char secret (openssl rand -hex 32)}
      # SECURITY: never add PLEX_TOKEN, LASTFM_API_SECRET, or any volume to the gateway.
      # It only holds the signing secret, so a compromised gateway can never act as admin.
      - TRACKSEERR_CORE_URL=http://trackseerr-core:5251
      - APPLICATION_URL=https://trackseerr.yourdomain.com
      # Reverse-proxy IPs/CIDRs whose X-Forwarded-For is trusted for login throttling (unset = use the peer address).
      # - TRUSTED_PROXIES=172.18.0.0/16
      - PORT=5250
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC
      - LOG_LEVEL=INFO
    networks:
      - proxynet
      - internal
    # Zero filesystem volumes mounted into gateway tier

  # ---------------------------------------------------------------------------
  # Tier 2: Core Engine & Downloader Coordinator (Internal Isolated Network)
  # Published only on the LAN/loopback address (CORE_LAN_BIND); never internet-facing.
  # Holds persistent database (/config) and unified TRaSH Guides data share (/data).
  # Peered directly with slskd, SABnzbd, qBittorrent, and Plex Media Server.
  # ---------------------------------------------------------------------------
  trackseerr-core:
    image: ghcr.io/ronfburgundy/trackseerr:latest
    container_name: trackseerr-core
    restart: unless-stopped
    # Admin UI + Plex webhook, LAN-only. Set CORE_LAN_BIND to the host's LAN IP
    # (default loopback). Never expose 5251 to the internet.
    ports:
      - "${CORE_LAN_BIND:-127.0.0.1}:5251:5251"
    volumes:
      # AppData storage for persistent SQLite database, auth sessions, and logs
      - ./appdata:/config
      # TRaSH Guides recommended unified data share.
      # Contains both library (/data/media/music) and completed downloads (/data/downloads)
      # on the same filesystem mount to enable instant atomic moves and hardlinks.
      - /path/to/data:/data
    environment:
      - ROLE=core
      # Informational: tells core which LAN IP its admin port is published on (suppresses the exposure warning).
      - CORE_LAN_BIND=${CORE_LAN_BIND:-127.0.0.1}
      - INTERNAL_CORE_SECRET=${INTERNAL_CORE_SECRET:?set a 32+ char secret (openssl rand -hex 32)}
      - APPLICATION_URL=https://trackseerr.yourdomain.com
      - PORT=5251
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC
      # Non-Plex setups: uncomment to create the initial admin user ("admin") on first start
      # - ADMIN_PASSWORD=change-me-to-12-or-more-characters
      # Plex: connect to Plex Media Server (use LAN IP, not localhost)
      # - PLEX_URL=http://192.168.1.100:32400
      # - PLEX_TOKEN=your_plex_token_here
      # - PLEX_MUSIC_SECTION=Music
      # - PLEX_VERIFY_SSL=1
      # Jellyfin: connect to Jellyfin media server
      # - MEDIA_SERVER=jellyfin
      # - JELLYFIN_URL=http://192.168.1.100:8096
      # - JELLYFIN_API_KEY=your_jellyfin_api_key
      # Subsonic: connect to Navidrome, Gonic, Airsonic, or Subsonic server
      # - MEDIA_SERVER=subsonic
      # - SUBSONIC_URL=http://192.168.1.100:4533
      # - SUBSONIC_USER=your_subsonic_username
      # - SUBSONIC_PASSWORD=your_subsonic_password
      - SECONDS_TO_WAIT=14400
      - SEARCH_SIMILARITY_THRESHOLD=0.9
      - LOG_LEVEL=INFO
      # Optional Last.fm scrobbling. Core ONLY, never the gateway.
      # - LASTFM_API_KEY=your_lastfm_api_key
      # - LASTFM_API_SECRET=your_lastfm_api_secret
    networks:
      - internal
      - core-lan

networks:
  # Your EXISTING reverse-proxy / cloudflared network (create it first or change PROXY_NETWORK).
  # Cloudflare Tunnel's cloudflared must share this network with the gateway, never with core.
  proxynet:
    name: ${PROXY_NETWORK:-proxynet}
    external: true
  # Private gateway<->core link: no egress, no published ports.
  internal:
    name: ${TRACKSEERR_INTERNAL_NETWORK:-trackseerr-internal}
    internal: true
  # Non-internal bridge so core can publish its admin port and reach Plex on the LAN.
  core-lan:
    name: trackseerr-core-lan
    driver: bridge
