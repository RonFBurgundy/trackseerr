services:
  trackseerr:
    image: ghcr.io/ronfburgundy/trackseerr:latest
    container_name: trackseerr
    restart: unless-stopped
    ports:
      - "5250:5250"
    volumes:
      # AppData storage for persistent SQLite database, auth sessions, and logs
      - ./appdata:/config
      # TRaSH Guides recommended unified data share.
      # Contains both library (/data/media/music) and completed downloads (/data/downloads)
      # on the same filesystem mount to enable instant atomic moves and hardlinks.
      - /path/to/data:/data
    environment:
      # --- Permissions ---
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC

      # --- WebUI & Port ---
      - PORT=5250
      # Optional: Public domain / external URL (e.g. https://trackseerr.yourdomain.com)
      # Used for notification link-backs, Plex OAuth redirects, and reverse proxy routing.
      # SECURITY ADVISORY: If exposing TrackSeerr to the internet via Cloudflare Tunnels, Nginx,
      # Caddy, or Traefik, we strongly recommend deploying the Hardened Two-Tier DMZ mode
      # (docker-compose.hardened.yml) where the public gateway is stateless with zero volume mounts.
      # - APPLICATION_URL=https://trackseerr.yourdomain.com

      # --- Media Server & First Admin ---
      # Non-Plex setups: uncomment to create the initial admin user ("admin") on first start
      # - ADMIN_PASSWORD=change-me-to-12-or-more-characters
      # Plex: connect to Plex Media Server (use LAN IP, not localhost)
      # - PLEX_URL=http://192.168.1.100:32400
      # - PLEX_TOKEN=your_plex_token_here
      # - PLEX_MUSIC_SECTION=Music
      # - PLEX_VERIFY_SSL=1
      # - PLEX_MACHINE_IDENTIFIER=
      # Jellyfin: connect to Jellyfin media server
      # - MEDIA_SERVER=jellyfin
      # - JELLYFIN_URL=http://192.168.1.100:8096
      # - JELLYFIN_API_KEY=your_jellyfin_api_key
      # Subsonic: connect to Navidrome, Gonic, Airsonic, or Subsonic server
      # - MEDIA_SERVER=subsonic
      # - SUBSONIC_URL=http://192.168.1.100:4533
      # - SUBSONIC_USER=your_subsonic_username
      # - SUBSONIC_PASSWORD=your_subsonic_password

      # --- Feeds & Webhooks ---
      # Optional: Token for securing Lidarr RSS/JSON missing track feeds
      # - FEED_TOKEN=

      # --- Spotify (OPTIONAL) ---
      # Leave SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET blank to use the built-in KEYLESS web scraper!
      # - SPOTIFY_CLIENT_ID=
      # - SPOTIFY_CLIENT_SECRET=

      # --- Deezer (OPTIONAL) ---
      # - DEEZER_USER_ID=
      # - DEEZER_PLAYLIST_ID=

      # --- Sync Engine & Scheduling ---
      - SECONDS_TO_WAIT=14400 # 4 hours
      - SEARCH_SIMILARITY_THRESHOLD=0.9
      - APPEND_SERVICE_SUFFIX=1
      - ADD_PLAYLIST_POSTER=1
      - ADD_PLAYLIST_DESCRIPTION=1
      - WRITE_MISSING_AS_CSV=0
      - LOG_LEVEL=INFO
